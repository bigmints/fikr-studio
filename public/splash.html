<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fikr Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: transparent;
      -webkit-app-region: drag;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #111118 50%, #0d0d15 100%);
      border-radius: 16px;
    }

    /* ── Ambient glow ── */
    .glow {
      position: absolute;
      width: 380px; height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(45,212,191,0.07) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* ── Logo ── */
    .logo-wrap {
      width: 88px; height: 88px;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: 0 8px 40px rgba(45,212,191,0.22), 0 2px 12px rgba(0,0,0,0.6);
      animation: logoPulse 2.5s ease-in-out infinite;
      position: relative; z-index: 1;
      flex-shrink: 0;
    }
    .logo-wrap img { width: 100%; height: 100%; display: block; object-fit: cover; }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 8px 40px rgba(45,212,191,0.22), 0 2px 12px rgba(0,0,0,0.6); }
      50%       { box-shadow: 0 8px 60px rgba(45,212,191,0.40), 0 2px 20px rgba(0,0,0,0.7); }
    }


    /* ── Text ── */
    .app-name {
      font-size: 21px; font-weight: 700;
      color: rgba(255,255,255,0.92);
      letter-spacing: -0.02em;
      margin-bottom: 5px;
      position: relative; z-index: 1;
    }
    .app-sub {
      font-size: 11px; font-weight: 400;
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.09em;
      margin-bottom: 44px;
      position: relative; z-index: 1;
    }

    /* ── Progress bar ── */
    .bar-track {
      width: 200px; height: 3px;
      border-radius: 4px;
      background: rgba(255,255,255,0.07);
      overflow: hidden;
      margin-bottom: 14px;
      position: relative; z-index: 1;
    }
    .bar-shimmer {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(45,212,191,0.5), transparent);
      animation: shimmer 1.4s ease-in-out infinite;
    }
    .bar-fill {
      height: 100%; width: 0%;
      border-radius: 4px;
      background: linear-gradient(90deg, #2dd4bf, #0ea5e9);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative; z-index: 1;
    }
    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }

    /* ── Status label ── */
    .status {
      font-size: 11.5px;
      color: rgba(255,255,255,0.32);
      letter-spacing: 0.01em;
      min-height: 17px;
      transition: color 0.3s;
      position: relative; z-index: 1;
    }
    .status.ready { color: rgba(45,212,191,0.9); }
  </style>
</head>
<body>
  <div class="glow"></div>

  <div class="logo-wrap">
    <img src="logo-icon.png" alt="Fikr Studio" />
  </div>

  <div class="app-name">Fikr</div>
  <div class="app-sub">Think out loud</div>

  <div class="bar-track">
    <div class="bar-shimmer" id="shimmer"></div>
    <div class="bar-fill"   id="fill"></div>
  </div>

  <div class="status" id="status">Starting up…</div>

  <script>
    let dots = '';
    let dotTimer = setInterval(() => {
      dots = dots.length >= 3 ? '' : dots + '.';
      const el = document.getElementById('status');
      if (el && !el.classList.contains('ready')) {
        el.textContent = (window._currentLabel || 'Starting up') + dots;
      }
    }, 500);

    function applyProgress(phase, label, percent) {
      window._currentLabel = label;

      const fill    = document.getElementById('fill');
      const shimmer = document.getElementById('shimmer');
      const status  = document.getElementById('status');

      if (fill)    fill.style.width = percent + '%';
      if (fill)    fill.style.boxShadow = percent > 0 ? '0 0 8px rgba(45,212,191,0.7)' : 'none';

      // Hide shimmer once we have real progress
      if (shimmer) shimmer.style.display = percent > 0 ? 'none' : 'block';

      if (phase === 'ready') {
        clearInterval(dotTimer);
        if (status) { status.textContent = 'Ready'; status.classList.add('ready'); }
      }
    }

    // Listen to IPC events from the main process via the preload bridge
    if (window.fikrStudio && window.fikrStudio.onSplashProgress) {
      window.fikrStudio.onSplashProgress(function(ev) {
        applyProgress(ev.phase, ev.label, ev.percent);
      });
    }
  </script>
</body>
</html>
