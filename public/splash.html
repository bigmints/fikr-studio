<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fikr</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: #f7f7f5;
      --ink: #111110;
      --muted: #73736f;
      --line: rgba(17, 17, 16, 0.12);
      --track: rgba(17, 17, 16, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #111110;
        --ink: #f3f3ef;
        --muted: #94948e;
        --line: rgba(255, 255, 255, 0.13);
        --track: rgba(255, 255, 255, 0.09);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-app-region: drag;
    }

    body {
      display: flex;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.18);
    }

    main {
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: 34px 36px 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--ink);
      display: grid;
      place-items: center;
      overflow: hidden;
      flex: none;
    }

    .mark-glyph {
      width: 25px;
      height: 25px;
      background: var(--surface);
      -webkit-mask: url('logo.svg') center / contain no-repeat;
      mask: url('logo.svg') center / contain no-repeat;
    }

    .wordmark {
      font-family: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.025em;
      line-height: 1;
    }

    .message {
      margin-top: 42px;
      max-width: 270px;
      font-family: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-size: 1.875rem;
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .footer {
      margin-top: auto;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 11px;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.01em;
    }

    .percent {
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .track {
      width: 100%;
      height: 2px;
      overflow: hidden;
      background: var(--track);
    }

    .fill {
      width: 0;
      height: 100%;
      background: var(--ink);
      transition: width 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .fill { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="mark" aria-hidden="true"><span class="mark-glyph"></span></div>
      <div class="wordmark">Fikr</div>
    </div>

    <p class="message">A quiet place for your thinking.</p>

    <div class="footer">
      <div class="status-row">
        <span id="status" aria-live="polite">Starting</span>
        <span class="percent" id="percent">0%</span>
      </div>
      <div class="track" role="progressbar" aria-label="Starting Fikr" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="fill" id="fill"></div>
      </div>
    </div>
  </main>

  <script>
    function applyProgress(phase, label, percent) {
      const safePercent = Math.max(0, Math.min(100, Number(percent) || 0));
      const fill = document.getElementById('fill');
      const status = document.getElementById('status');
      const percentage = document.getElementById('percent');
      const track = document.querySelector('[role="progressbar"]');

      if (fill) fill.style.width = safePercent + '%';
      if (status) status.textContent = phase === 'ready' ? 'Ready' : label;
      if (percentage) percentage.textContent = safePercent + '%';
      if (track) track.setAttribute('aria-valuenow', String(safePercent));
    }

    if (window.fikrStudio && window.fikrStudio.onSplashProgress) {
      window.fikrStudio.onSplashProgress(function(event) {
        applyProgress(event.phase, event.label, event.percent);
      });
    }
  </script>
</body>
</html>
