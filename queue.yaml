  # ─────────────────────────────────────────────────────────────────────
  - name: "Guided 3-step onboarding replacing one-shot modal"
    prompt: |
      You are replacing the one-shot intro modal with a contextual, 3-step onboarding flow.

      PROBLEM:
      `components/intro-modal.tsx` shows a single modal on first launch, then disappears
      forever. FikrPad has 14 content types, graph view, ghost synthesis, semantic search,
      MCP integration, and more. A single modal cannot onboard users to this complexity.

      GOAL:
      Replace `IntroModal` with a contextual onboarding system that guides users through
      3 steps as they use the app for the first time. Steps unlock as the user takes actions.

      CURRENT STATE:
      - `components/intro-modal.tsx` — Single intro modal with video/tutorial
      - `app/page.tsx` — `isIntroOpen` state, `handleIntroClose` sets `introSeen` flag
      - Intro is dismissed via IPC: `window.fikrpad.setIntroSeen()` or localStorage

      NEW ONBOARDING DESIGN:
      Create a new component `components/onboarding.tsx` with a lightweight overlay system.

      The onboarding has 3 steps that trigger based on user state:

      STEP 1 — "First Note" (triggers when user has 0 blocks on a fresh install):
      - Show a thin overlay at the bottom above the VimInput
      - Content: "Type any thought, observation, or idea. AI will automatically classify it."
      - Include example: "Try: 'What causes redshift in distant galaxies?'"
      - Dismiss when user adds their first note (blocks.length >= 1)

      STEP 2 — "First Enrichment" (triggers after first note completes enrichment):
      - Show a toast-style notification
      - Content: "AI classified your note. Try writing more notes — it will find connections between them."
      - Dismiss after 5 seconds or on click

      STEP 3 — "First Connections" (triggers when any note has influencedBy > 0):
      - Show a guided tooltip pointing to the connection indicator on the card
      - Content: "Your notes are connected! Hover the link indicator to see relationships."
      - Dismiss when user clicks a connection indicator

      IMPLEMENTATION:
      1. Create `components/onboarding.tsx`:
         ```
         interface OnboardingState {
           step: 0 | 1 | 2 | 3; // 0 = not started, 3 = complete
         }

         export function OnboardingOverlay({
           blockCount,
           enrichedCount,
           connectedCount,
           onDismiss,
           onComplete,
         }: OnboardingOverlayProps) {
           // Render based on state
         }
         ```

      2. In `app/page.tsx`:
         - Track onboarding state: `const [onboardingStep, setOnboardingStep] = useState<number>(0)`
         - Determine step from data:
           - 0 blocks → step 1
           - 1+ blocks but 0 connected → step 2
           - 1+ connected blocks → step 3
           - introSeen && blocks.length > 3 → skip entirely
         - Pass appropriate counts to OnboardingOverlay

      3. Persist onboarding completion:
         - Store in localStorage: `fikrpad-onboarding-step`
         - On load, restore step from localStorage
         - When step 3 completes, set `fikrpad-onboarding-complete: true`

      4. UI Design:
         - Step 1: Bottom overlay, above VimInput. Dark backdrop with frosted glass.
           Animated arrow pointing to input bar. Text: "Start thinking →"
         - Step 2: Top-right toast. "✨ AI found: [category]" with a brief explanation.
         - Step 3: Center toast with connection icon. "🔗 Your notes are linked!"
         - All steps: Dismissible via ✕ button. "Skip" option.
         - Style: Match existing toast at line 1458 (bg-black/90, rounded-sm, font-mono text-[10px])

      5. Keep the existing IntroModal as a fallback — if onboarding hasn't started and
         intro is not seen, show the modal. But once onboarding starts, the modal closes.

      STYLING:
      - Use motion/AnimatePresence for enter/exit animations
      - Step overlays should use `z-[200]` to float above everything
      - Match the existing dark theme: `bg-card/90 border border-border/40 backdrop-blur-xl`
      - Keep text concise: 1-2 sentences max per step

      FILES TO MODIFY:
      - Create: `components/onboarding.tsx`
      - Modify: `app/page.tsx` (add onboarding state + integrate)
      - Modify: `components/intro-modal.tsx` (keep as fallback, wire to onboarding)
