queue:
  # ─────────────────────────────────────────────────────────────────────
  # 1. P0 — Stop type flicker by caching last AI classification
  # ─────────────────────────────────────────────────────────────────────
  - name: "Fix type flicker: cache lastContentType during enrichment"
    prompt: |
      You are editing a Next.js + React codebase for FikrPad (a spatial thinking tool).

      PROBLEM:
      When a user edits a note, the card shows type "general" while AI enrichment runs (see
      page.tsx lines 941-943 where `initialDisplayType` is set to "general" for ambiguous types).
      This causes a visible flicker: general → claim → idea → etc. The same happens on every
      edit because `editBlock` at line 1023 sets `isEnriching: true` without preserving the
      current type.

      FILES TO MODIFY:
      1. `components/tile-card.tsx` — The `TextBlock` interface (line 25) needs a new optional field:
         `lastContentType?: ContentType` — stores the last AI-classified type.

      2. `app/page.tsx` — In `addBlock` (around line 889), when creating a new block, if the
         heuristic type is high-confidence, also store it as `lastContentType`. In `editBlock`
         (around line 1023), preserve the current block's contentType as `lastContentType` when
         setting `isEnriching: true`. The line that currently reads:
         `{ ...b, text: newText, isEnriching: true, isError: false }`
         Should become:
         `{ ...b, text: newText, isEnriching: true, isError: false, lastContentType: b.contentType }`

      3. `app/page.tsx` — In `enrichBlock` (around line 750), when the AI returns a new contentType,
         store the PREVIOUS contentType as `lastContentType` on the block:
         When updating block at line 753, add `lastContentType: b.contentType` to the result.
         ALSO update the `initialDisplayType` logic (line 941): when `isEnriching` is true,
         use `block.lastContentType ?? "general"` instead of just `"general"`.

      4. `lib/nodepad-format.ts` — Add `lastContentType` to the `NodepadBlock` interface and
         serialization so it persists across sessions.

      IMPLEMENTATION:
      - Add `lastContentType?: ContentType` to TextBlock in tile-card.tsx
      - Preserve it on every edit/enrich call in page.tsx
      - Use it as the display type during enrichment instead of "general"
      - Persist it in nodepad-format.ts serialization
      - Do NOT change any AI logic, only the display behavior during loading state

      Verify: after the change, editing a "claim" note should keep showing "claim" (with shimmer)
      while enrichment runs, instead of flickering to "general" first.
