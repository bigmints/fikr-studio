  # ─────────────────────────────────────────────────────────────────────
  - name: "Accessibility: ARIA groups, contrast fixes, focus-visible"
    prompt: |
      You are performing an accessibility pass on FikrPad's tile cards and status bar.

      PROBLEM:
      - Screen readers read each tile card as individual buttons without semantic grouping
      - Elements at 40% opacity of muted-foreground fail WCAG AA contrast
      - No focus-visible outlines for keyboard navigation
      - Confidence bar, connection indicators, and category tags lack ARIA attributes

      GOAL: Make cards readable as semantic units, ensure contrast passes, add keyboard focus.

      IMPLEMENTATION:

      1. TILE CARD (`components/tile-card.tsx`):
         - Wrap the entire motion.div (line 277) with semantic attributes:
           ```
           role="article"
           aria-labelledby={`card-title-${block.id}`}
           tabIndex={0}
           ```
         - Add `aria-describedby` pointing to the annotation text
         - Confidence bar (line 731): Add `role="meter"` with `aria-valuenow` and `aria-label`:
           ```
           role="meter"
           aria-label={`AI confidence: ${Math.round(block.confidence)}%`}
           aria-valuenow={Math.round(block.confidence)}
           aria-valuemin={0}
           aria-valuemax={100}
           ```
         - Connection indicator (line 378): Add `title` and `aria-label`:
           ```
           aria-label={`${block.influencedBy.length} connected notes`}
           ```
         - All buttons in header: Add `aria-label` if they don't have one (delete has it, pin has it)

      2. CONTRAST FIXES — In `components/tile-card.tsx` and `components/status-bar.tsx`:
         - Replace `text-muted-foreground/40` with `text-muted-foreground/55` for readable text
         - Replace `text-muted-foreground/50` with `text-muted-foreground/60` for secondary text
         - Affected elements: timestamp (line 373), connection dots (line 393), type label (line 342),
           category tag (line 784), influence count (line 809), confidence labels (line 740)
         - DON'T change decorative elements (dividers, icons) — only text content
         - In the status bar (status-bar.tsx), the search placeholder at line 141 uses
