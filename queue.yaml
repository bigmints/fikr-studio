  # ─────────────────────────────────────────────────────────────────────
  # 6. P2 — Communication: ghost synthesis limits visible to user
  # ─────────────────────────────────────────────────────────────────────
  - name: "Communicate ghost synthesis requirements to user"
    prompt: |
      You are making the ghost synthesis gating conditions visible to users.

      PROBLEM:
      Ghost synthesis (AI-generated cross-note themes) is silently gated behind conditions
      (page.tsx lines 483-511): 5 enriched blocks, 5 new blocks since last generation,
      5 minutes since last generation, 2 distinct categories. When conditions aren't met,
      `generateGhostNote` returns early with no feedback. Users think the feature is broken.

      GOAL: Show a status message explaining what's needed.

      CURRENT STATE:
      - `app/page.tsx` — `generateGhostNote` function silently checks conditions and returns
      - `components/ghost-panel.tsx` — Displays ghost notes, has a "Generate" button

      IMPLEMENTATION:
      1. In `app/page.tsx`, compute ghost status as derived state:
         ```
         const ghostStatus = useMemo(() => {
           if (!activeProject) return null;
           const enriched = activeProject.blocks.filter(b => !b.isEnriching && b.category);
           const categories = new Set(enriched.map(b => b.category));
           const lastCount = activeProject.lastGhostBlockCount || 0;
           const lastTime = activeProject.lastGhostTimestamp || 0;
           const timeSinceLast = Date.now() - lastTime;

           if (enriched.length < 5) {
             return { ready: false, message: `Need ${5 - enriched.length} more notes to generate insights` };
           }
           if (categories.size < 2) {
             return { ready: false, message: "Need notes from 2+ different categories" };
           }
           if (enriched.length < lastCount + 5) {
             return { ready: false, message: `Add ${lastCount + 5 - enriched.length} more notes since last insight` };
           }
           if (timeSinceLast < 5 * 60 * 1000) {
             const remaining = Math.ceil((5 * 60 * 1000 - timeSinceLast) / 1000);
             return { ready: false, message: `Available in ${remaining}s` };
           }
           return { ready: true };
         }, [activeProject, blocks]);
         ```

      2. Pass `ghostStatus` to `GhostPanel` in `components/ghost-panel.tsx`.

      3. In the ghost panel, when the "Generate" button is disabled, show the status message:
         Below the existing generate button, add:
         ```
         {ghostStatus && !ghostStatus.ready && (
           <p className="text-[11px] text-muted-foreground/50 mt-2">
             {ghostStatus.message}
           </p>
         )}
         ```

      4. The ghost panel's generate button should be `disabled={!ghostStatus?.ready}` instead
         of relying on the silent early return in `generateGhostNote`.

      FILES TO MODIFY:
      - `app/page.tsx` (add ghostStatus computation + pass to GhostPanel)
      - `components/ghost-panel.tsx` (accept ghostStatus prop, display status message)
