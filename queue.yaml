      GOAL:
      Show a thin, non-intrusive indicator in the status bar: "AI is processing 3 notes…"
      that disappears when all enrichment is complete.

      CURRENT STATE:
      - `components/status-bar.tsx` — Header bar at the top with menu, search, view toggles
      - `app/page.tsx` — `blocks` array has `isEnriching` flag on each block
      - Blocks get `isEnriching: true` on add/edit, then `isEnriching: false` when done

