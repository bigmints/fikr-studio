      destructive. A user with 100 notes in a project can lose everything with one click.

      GOAL: 24-hour trash with recovery + confirmation for destructive actions.

      CURRENT STATE:
      - `app/page.tsx` — `deleteBlock`, `deleteProject`, `clearBlocks` are instant
      - `components/project-sidebar.tsx` — Project management sidebar with delete
      - No trash concept exists

      IMPLEMENTATION:

      1. TRASH DATA MODEL — Add to the Project type in `app/page.tsx`:
         ```
         interface TrashedBlock extends TextBlock {
           trashedAt: number;
         }
         ```
         Add `trashedBlocks: TrashedBlock[]` to the Project interface.

      2. MODIFY `deleteBlock` — Instead of filtering, move to trash:
         ```
         const deleteBlock = useCallback((id: string) => {
           pushHistory(activeProjectId, blocksRef.current);
           updateActiveProject((p) => ({
             ...p,
             blocks: p.blocks.filter((b) => b.id !== id),
             trashedBlocks: [...(p.trashedBlocks || []), { ...p.blocks.find(b => b.id === id), trashedAt: Date.now() }],
           }));
           showUndoToast("Moved to trash");
         }, [activeProjectId, pushHistory, updateActiveProject, showUndoToast]);
         ```

      3. AUTO-CLEANUP — Add a useEffect that purges trash older than 24 hours:
         ```
         useEffect(() => {
           setProjects((prev) =>
             prev.map((p) => ({
               ...p,
               trashedBlocks: (p.trashedBlocks || []).filter(
                 (b) => Date.now() - (b.trashedAt || 0) < 24 * 60 * 60 * 1000
               ),
