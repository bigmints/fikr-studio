name: Release macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: FBG8NKYPUJ
      KEYCHAIN_PATH: ${{ github.workspace }}/fikr-studio-release.keychain-db
      KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          expected_tag="v${package_version}"
          echo "Release tag: ${GITHUB_REF_NAME}"
          echo "Package version: ${package_version}"
          test "${GITHUB_REF_NAME}" = "${expected_tag}"

      - name: Install dependencies and verify source
        run: |
          npm ci --legacy-peer-deps
          npm run verify

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application: Pretheesh Thomas (FBG8NKYPUJ)'

      - name: Configure App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$APPLE_API_KEY_P8"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"
          echo "APPLE_API_KEY=$API_KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"

      - name: Build signed and notarized release candidate
        env:
          CSC_KEYCHAIN: ${{ runner.temp }}/fikr-studio-release.keychain-db
        run: |
          npm run build
          npx electron-builder build --mac -p never
          node scripts/refresh-mac-update-metadata.mjs

      - name: Verify exact release artifacts
        run: |
          VERSION="$(node -p \"require('./package.json').version\")"
          node scripts/check-macos-package.mjs "dist/mac-arm64/Fikr Studio.app"
          node scripts/verify-macos-release.mjs \
            "dist/mac-arm64/Fikr Studio.app" \
            "dist/Fikr Studio-${VERSION}-arm64.dmg" \
            "dist/Fikr Studio-${VERSION}-arm64-mac.zip"
          npm run check:asar

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p \"require('./package.json').version\")"
          TAG="v${VERSION}"
          gh release create "$TAG" \
            --title "Fikr Studio ${VERSION}" \
            "dist/Fikr Studio-${VERSION}-arm64.dmg" \
            "dist/Fikr Studio-${VERSION}-arm64.dmg.blockmap" \
            "dist/Fikr Studio-${VERSION}-arm64-mac.zip" \
            "dist/Fikr Studio-${VERSION}-arm64-mac.zip.blockmap" \
            "dist/latest-mac.yml"

      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
