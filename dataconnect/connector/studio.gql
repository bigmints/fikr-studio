
# ─────────────────────────────────────────────────────────────────────────────
# Projects
# ─────────────────────────────────────────────────────────────────────────────
#
# All operations use @auth(level: NO_ACCESS).
# This means they cannot be called from any client SDK.
# They are ONLY accessible via the Firebase Admin SDK from the Electron
# main process, which bypasses all Data Connect auth rules.
#

# List all active (non-archived) projects for a user
query ListProjects($userId: String!) @auth(level: NO_ACCESS) {
  studioProjects(
    where: { userId: { eq: $userId }, archivedAt: { isNull: true } }
    orderBy: { createdAt: ASC }
  ) {
    id
    name
    createdAt
    updatedAt
  }
}

# Create a new project
mutation CreateProject($userId: String!, $name: String!) @auth(level: NO_ACCESS) {
  studioProject_insert(data: { userId: $userId, name: $name })
}

# Rename an existing project
mutation RenameProject($id: UUID!, $name: String!) @auth(level: NO_ACCESS) {
  studioProject_update(id: $id, data: { name: $name })
}

# Soft-delete a project (archive it)
mutation ArchiveProject($id: UUID!) @auth(level: NO_ACCESS) {
  studioProject_update(id: $id, data: { archivedAt_expr: "request.time" })
}

# Get a single project by ID (used for ownership verification)
query GetProject($id: UUID!) @auth(level: NO_ACCESS) {
  studioProject(id: $id) {
    id
    name
    userId
    createdAt
    updatedAt
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# Notes (canvas blocks)
# ─────────────────────────────────────────────────────────────────────────────

# Get all regular notes (non-ghost) for a project
query GetNotesByProject($projectId: UUID!) @auth(level: NO_ACCESS) {
  studioNotes(
    where: { project: { id: { eq: $projectId } }, isGhostNote: { eq: false } }
    orderBy: { createdAt: ASC }
  ) {
    id
    text
    contentType
    category
    annotation
    confidence
    isEnriching
    isError
    fromMcp
    fromSkill
    collapsedInProject
    createdAt
    updatedAt
  }
}

# Get synthesis / ghost notes for a project
query GetGhostNotes($projectId: UUID!) @auth(level: NO_ACCESS) {
  studioNotes(
    where: { project: { id: { eq: $projectId } }, isGhostNote: { eq: true } }
    orderBy: { createdAt: ASC }
  ) {
    id
    text
    contentType
    category
    annotation
    confidence
    createdAt
    updatedAt
  }
}

# Create a new note
mutation CreateNote(
  $projectId: UUID!
  $userId: String!
  $text: String!
  $contentType: String
  $category: String
  $annotation: String
  $confidence: Float
  $isEnriching: Boolean
  $isGhostNote: Boolean
  $fromMcp: Boolean
  $fromSkill: Boolean
) @auth(level: NO_ACCESS) {
  studioNote_insert(
    data: {
      project: { id: $projectId }
      userId: $userId
      text: $text
      contentType: $contentType
      category: $category
      annotation: $annotation
      confidence: $confidence
      isEnriching: $isEnriching
      isGhostNote: $isGhostNote
      fromMcp: $fromMcp
      fromSkill: $fromSkill
    }
  )
}

# Update the enrichment fields of a note
mutation UpdateNote(
  $id: UUID!
  $text: String!
  $contentType: String
  $category: String
  $annotation: String
  $confidence: Float
  $isEnriching: Boolean
  $isError: Boolean
) @auth(level: NO_ACCESS) {
  studioNote_update(
    id: $id
    data: {
      text: $text
      contentType: $contentType
      category: $category
      annotation: $annotation
      confidence: $confidence
      isEnriching: $isEnriching
      isError: $isError
    }
  )
}

# Hard-delete a note
mutation DeleteNote($id: UUID!) @auth(level: NO_ACCESS) {
  studioNote_delete(id: $id)
}

# Mark a note's collapsed state in the canvas
mutation SetNoteCollapsed($id: UUID!, $collapsed: Boolean!) @auth(level: NO_ACCESS) {
  studioNote_update(id: $id, data: { collapsedInProject: $collapsed })
}

# Batch delete all notes for a project (used when archiving)
mutation DeleteNotesByProject($projectId: UUID!) @auth(level: NO_ACCESS) {
  studioNote_deleteMany(
    where: { project: { id: { eq: $projectId } } }
  )
}
