specVersion: "v1beta"
serviceId: "fikr-apps-service"
location: "us-central1"
schema:
  source: "./schema"
  datasource:
    postgresql:
      database: "fikr-apps-database"
      cloudSql:
        instanceId: "fikr-apps-instance"
connectorDirs:
  - "./connector"
generate:
  javascriptSdk:
    outputDir: "../dataconnect-generated/js/studio-connector"
    package: "@studio-connector/default"
    packageJsonDir: "../dataconnect-generated/js/studio-connector"
