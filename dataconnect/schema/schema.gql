# Fikr Studio — Data Connect Schema
# PostgreSQL tables for projects and notes, isolated from the main Fikr app's Firestore.

type StudioProject @table(name: "studio_projects", singular: "studioProject", plural: "studioProjects") {
  # Auto-generated UUID primary key
  id: UUID! @default(expr: "uuidV4()")

  # Firebase UID of the owner — all queries are scoped by this
  userId: String! @col(name: "user_id")

  # Display name of the project / canvas
  name: String!

  # Whether the project is soft-deleted (archived)
  archivedAt: Timestamp @col(name: "archived_at")

  createdAt: Timestamp! @default(expr: "request.time") @col(name: "created_at")
  updatedAt: Timestamp! @default(expr: "request.time") @col(name: "updated_at")
}

type StudioNote @table(name: "studio_notes", singular: "studioNote", plural: "studioNotes") {
  # Auto-generated UUID primary key
  id: UUID! @default(expr: "uuidV4()")

  # FK → StudioProject.id
  project: StudioProject!

  # Denormalized owner UID for fast per-user queries without joins
  userId: String! @col(name: "user_id")

  # Raw text content of the note
  text: String!

  # AI-classified content type
  # Values: claim | question | task | idea | entity | quote |
  #         reference | definition | opinion | reflection | narrative | comparison | general
  contentType: String @col(name: "content_type")

  # Short domain label, e.g. 'Product Strategy', 'Engineering'
  category: String

  # 2–4 sentence AI-generated annotation
  annotation: String

  # Classification confidence 0–100
  confidence: Float

  # Whether this is a synthesis / ghost note (shown in synthesis panel)
  isGhostNote: Boolean! @default(expr: "false") @col(name: "is_ghost_note")

  # Whether the note is currently being enriched by the AI
  isEnriching: Boolean! @default(expr: "false") @col(name: "is_enriching")

  # Whether enrichment hit an error state
  isError: Boolean! @default(expr: "false") @col(name: "is_error")

  # Whether the note was created via MCP
  fromMcp: Boolean! @default(expr: "false") @col(name: "from_mcp")

  # Whether the note was created via a pre-synthesis skill
  fromSkill: Boolean! @default(expr: "false") @col(name: "from_skill")

  # Whether the note is collapsed in the masonry canvas
  collapsedInProject: Boolean! @default(expr: "false") @col(name: "collapsed_in_project")

  createdAt: Timestamp! @default(expr: "request.time") @col(name: "created_at")
  updatedAt: Timestamp! @default(expr: "request.time") @col(name: "updated_at")
}
